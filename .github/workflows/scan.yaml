              raise last_err or RuntimeError("akshare")


          def u_us():
              o = []
              for u, a, b in [("https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt",
                               "Symbol", "Security Name"),
                              ("https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt",
                               "ACT Symbol", "Security Name")]:
                  d = pd.read_csv(io.BytesIO(_get(u)), sep="|")
                  for _, r in d[d[a].notna()].iterrows():
                      s, nm = str(r[a]).strip(), str(r.get(b, ""))[:38]
                      if not s or "File Creation" in s or "test" in nm.lower():
                          continue
                      if any(ch in s for ch in "$."):
                          continue
                      if str(r.get("ETF", "N")).strip().upper() == "Y":
                          continue
                      if str(r.get("Test Issue", "N")).strip().upper() == "Y":
                          continue
                      o.append((s, nm))
              return o


          def enum_jp():
              return [(f"{c}.T", f"TSE{c}") for c in range(1300, 10000)]


          def enum_cn():
              o = []
              for lo, hi in [(600000, 601000), (601000, 601900), (603000, 603900),
                             (605000, 605600), (688000, 688900)]:
                  o += [(f"{c}.SS", f"SH{c}") for c in range(lo, hi)]
              for lo, hi in [(1, 1000), (2000, 3100), (300000, 301700)]:
                  o += [(f"{c:06d}.SZ", f"SZ{c:06d}") for c in range(lo, hi)]
              return o


          def universe(code, fn, enum_fn=None):
              """
              목록 조회.   성공 → cache/universe_XX.json 갱신
                          실패 → 캐시(14일 이내 아니어도 쓴다, 없는 것보다 낫다)
                               → 코드 대역 생성 (일본·중국)
                               → 빈 목록 + 사유
              """
              path = f"cache/universe_{code}.json"
              try:
                  u = fn()
                  if len(u) < 500:
                      raise ValueError(f"목록 {len(u)}개뿐")
                  json.dump({"ts": time.time(), "u": u}, open(path, "w", encoding="utf-8"),
                            ensure_ascii=False)
                  return u, "정상"
              except Exception as e:
                  msg = f"{type(e).__name__}: {str(e)[:160]}"
                  print(f"    [{code} 목록 실패] {msg}", flush=True)
                  traceback.print_exc()
              if os.path.exists(path):
                  try:
                      d = json.load(open(path, encoding="utf-8"))
                      u = [tuple(x) for x in d["u"]]
                      age = (time.time() - d["ts"]) / 86400
                      if len(u) >= 500:
                          return u, f"캐시 사용({age:.0f}일 전 목록)"
                  except Exception:
                      traceback.print_exc()
              if enum_fn:
                  return enum_fn(), "코드대역 생성(종목명 없음)"
              return [], f"목록 실패({msg.split(':')[0]})"


          # (이름, 코드, 목록함수, 대체생성, 벤치마크, 최저가, 최저 50일 평균거래대금)
          MKT = [("홍콩", "HK", u_hk, None, "^HSI", 3, 2e7),
                 ("한국", "KR", u_kr, None, "^KS11", 5000, 2e9),
                 ("일본", "JP", u_jp, enum_jp, "^N225", 500, 2e8),
                 ("중국", "CN", u_cn, enum_cn, "000001.SS", 5, 5e7),
                 ("미국", "US", u_us, None, "^GSPC", 5, 5e6)]
          LBL = {"uptrend": "상승장", "downtrend": "하락장", "neutral": "횡보장", "": "판정불가"}
          NAME = {"KR": "한국", "US": "미국", "JP": "일본", "CN": "중국", "HK": "홍콩"}


          def regime(sym):
              for _a in range(3):
                  try:
                      b = yf.Ticker(sym).history(period="2y", auto_adjust=False)["Close"]
                      if b is not None and len(b) >= 200:
                          c, a, d = b.iloc[-1], b.rolling(50).mean().iloc[-1], b.rolling(200).mean().iloc[-1]
                          return "uptrend" if c > a > d else ("downtrend" if c < d else "neutral")
                  except Exception:
                      pass
                  time.sleep(5)
              return ""


          # =============================================================================
          #  종목 정보 (섹터·시총·ROE).  .info 는 러너 IP 에서 자주 막히므로 캐시를 쌓는다.
          # =============================================================================
          INFO_PATH = "cache/info.json"
          try:
              INFO = json.load(open(INFO_PATH, encoding="utf-8"))
          except Exception:
              INFO = {}
          INFO_HIT = {"cache": 0, "fast": 0, "info": 0, "fail": 0}


          def fetch_info(t):
              d = dict(INFO.get(t, {}))
              if d.get("sector"):
                  INFO_HIT["cache"] += 1
                  return d
              try:
                  tk = yf.Ticker(t)
                  try:                                     # 가벼운 엔드포인트
                      fi = tk.fast_info
                      mc = getattr(fi, "market_cap", None)
                      sh = getattr(fi, "shares", None)
                      if mc:
                          d["mcap"] = float(mc)
                          INFO_HIT["fast"] += 1
                      if sh:
                          d["shares"] = float(sh)
                  except Exception:
                      pass
                  got = False
                  for _a in range(2):
                      try:
                          i = tk.info or {}
                          if i.get("sector") or i.get("marketCap"):
                              d.update(sector=i.get("sector") or "", industry=i.get("industry") or "",
                                       mcap=i.get("marketCap") or d.get("mcap"),
                                       shares=i.get("floatShares") or i.get("sharesOutstanding") or d.get("shares"),
                                       roe=i.get("returnOnEquity"), inst=i.get("heldPercentInstitutions"))
                              got = True
                              break
                      except Exception:
                          pass
                      time.sleep(2)
                  INFO_HIT["info" if got else "fail"] += 1
                  if got:
                      INFO[t] = d
              except Exception:
                  INFO_HIT["fail"] += 1
              return d


          def save_info():
              try:
                  json.dump(INFO, open(INFO_PATH, "w", encoding="utf-8"), ensure_ascii=False)
              except Exception:
                  traceback.print_exc()


          def row(d, keys):
              if d is None or len(d) == 0:
                  return None
              ix = {str(x).strip().lower(): x for x in d.index}
              for k in keys:
                  if ix.get(k.lower()) is not None:
                      s = d.loc[ix[k.lower()]]
                      return pd.to_numeric(s.iloc[0] if isinstance(s, pd.DataFrame) else s, errors="coerce")
              return None


          # =============================================================================
          #  스캔
          # =============================================================================
          def main():
              rows, REG, stats, cut = [], {}, [], False
              set_deadline(BUDGET * 0.80)
              try:
                  for nm, code, fn, enum_fn, bench, minp, minvol in MKT:
                      if left() < 6:
                          cut = True
