                          d = r["depth"]; sc += 20 if 15 <= d <= 25 else (14 if 12 <= d <= 33 else 4)
                          h = r["hdepth"]; sc += 18 if 8 <= h <= 12 else (12 if 5 <= h <= 15 else 5)
