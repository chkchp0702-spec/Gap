          def write_report(l1, l2, TOP30, COND_STAT, REG, stats, cut):
              stamp = time.strftime("%Y-%m-%d (%a)", time.gmtime(time.time() + 32400))
              failed = {a for a, b, c, d in stats if b == 0}
              fr = l1[l1["막돌파"] == True] if len(l1) else pd.DataFrame()  # noqa: E712
              top = (l1[l1["코드"].isin(TOP30)].sort_values(CFG["score"], ascending=False)
                     if len(l1) else l1)
              act = l1[l1["매수권"] == True] if (IS_CUP and len(l1)) else l1  # noqa: E712
              FC, TC = CFG["FC"], CFG["TC"]

              def scan_row(a, b, c, d):
                  return (a, f"{b:,}", ("—" if c is None else str(c)), d)

              # ---------------- 마크다운 (이슈 본문) ----------------
              md = [f"# {CFG['title']} — {stamp}\n"]
              if failed:
                  md.append("> ⚠ **" + ", ".join(sorted(failed)) + "** 목록을 못 받아 스캔에서 빠졌습니다. "
                            "'발견 0'이 아니라 '조회 못함'입니다.\n")
              md += ["## 시장 상황\n", "| 나라 | 국면 |", "|---|---|"]
              for nm, code, *_ in MKT:
                  if code in REG:
                      md.append(f"| {nm} | {LBL[REG[code]]} |")
              md += ["", "## 스캔 결과\n", "| 나라 | 조회 | 발견 | 비고 |", "|---|---|---|---|"]
              for s in stats:
                  a, b, c, d = scan_row(*s)
                  md.append(f"| {a} | {b} | {c} | {d} |")
              md += ["", "\n## 섹터 흐름\n", "_아래 ★ 종목들이 어느 섹터에 몰려 있는지입니다._\n"]
              md += sector_note(fr if len(fr) else act)
              md += ["", f"\n## {CFG['star_h']} {len(fr)}개\n", f"_{CFG['star_desc']}._\n",
                     "_나라 이름을 누르면 펼쳐집니다._\n"]
              md += by_country(fr.sort_values(CFG["star_sort"]) if len(fr) else fr, FC)
              md += ["", f"\n## {CFG['top_h']} {len(top)}개\n",
                     f"_전체 {len(l1)}개 중 아래 조건을 모두 통과한 종목입니다._\n",
                     f"_{CFG['top_desc']}._\n", f"_전체 목록은 {CFG['list1']} 에 있습니다._\n"]
              if len(top) == 0 and COND_STAT:
                  md += [f"\n조건별 통과 수 (전체 {len(l1)}개 기준)\n", "| 조건 | 통과 |", "|---|---|"]
                  md += [f"| {cn_} | {cv_}개 |" for cn_, cv_ in COND_STAT]
                  md.append("")
              md += by_country(top, TC, open_first=True)
              md.append(f"\n## 리스트 2 — 캔슬림 통과 {len(l2)}개\n")
              if len(l2):
                  t2 = l2.rename(columns={"name": "종목명", "ticker": "코드", "market": "시장",
                                          "last": "현재가", "pivot": "매수기준가"})
