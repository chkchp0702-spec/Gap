                          if not hi or hi <= 0:
                              return pd.Series([np.nan, np.nan, False])
                          over = (r["last"] / hi - 1) * 100
                          ok = bool(-over <= G["ath_max"] * 100 and not r["newly"])
                          return pd.Series([round(hi, 2), round(over, 1), ok])
                      res[["ath", "ath_over", "ath_ok"]] = res.apply(_ath, axis=1)
                      res["fresh"] = (res["days"] <= G["star_days"]) & res["held"] & res["ath_ok"]

                      def score(r):
