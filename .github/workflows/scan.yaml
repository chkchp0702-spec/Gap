      - name: 스캔
        timeout-minutes: 115
        env:
          TIME_BUDGET_MIN: "95"
          TOP_FUND: "150"
        run: python scan.py

      - name: PDF 만들기
        if: always()
        run: |
          if [ -f report.html ]; then
            NAME=$(cat pdfname.txt 2>/dev/null || echo report_gap.pdf)
            mkdir -p results
            wkhtmltopdf --enable-local-file-access --print-media-type -q \
              --page-size A4 --orientation Landscape \
              --footer-right "[page] / [topage]" --footer-font-size 7 \
              --footer-font-name "Noto Sans CJK KR" --footer-spacing 4 \
              report.html "results/$NAME" || echo "PDF 변환 실패"
          fi

      - name: 파일 저장 (결과 + 목록·섹터 캐시)
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A results cache 2>/dev/null || true
          git diff --staged --quiet || git commit -m "갭 돌파 결과 $(TZ=Asia/Seoul date '+%m/%d')"
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || true
          git push || true

      - name: 결과 올리기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(cat issue_title.txt 2>/dev/null || echo "갭 돌파")
          if [ -f summary.md ]; then
            gh issue create --title "$TITLE $(TZ=Asia/Seoul date '+%m/%d %H:%M')" --body-file summary.md --repo "${{ github.repository }}"
          else
            gh issue create --title "$TITLE $(TZ=Asia/Seoul date '+%m/%d') - 실패" --body "스캔이 보고서를 만들지 못했습니다. Actions 로그를 확인하세요." --repo "${{ github.repository }}"
          fi
