                      if res["rs_raw"].notna().any() else np.nan
                  res = res.drop_duplicates("ticker").reset_index(drop=True)

                  # ---------- 2단계: 사상최고가 ----------
                  log(f"사상최고가 확인 {len(res)}종목")
                  ath = {}
                  set_deadline(max(2, left() * 0.4))
                  try:
                      tks = res["ticker"].tolist()
