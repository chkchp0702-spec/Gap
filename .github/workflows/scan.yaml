                          sc += 3 if pd.isna(a) else (12 if a <= 5 else (8 if a <= 15 else 3))
                          sc += 8 if r["up"] >= 50 else 4
                          return round(sc, 1)
                      res["score"] = res.apply(score, axis=1)
                      res = res.sort_values(["fresh", "actionable", "ath_piv_off"],
