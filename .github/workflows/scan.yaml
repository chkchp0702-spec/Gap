                          clear_deadline()
                  save_info()
                  log(f"종목정보 — 캐시 {INFO_HIT['cache']} · 신규 {INFO_HIT['info']} · "
                      f"실패 {INFO_HIT['fail']}")

                  # ---------- 섹터·투자포인트 ----------
                  l1["섹터"] = l1["코드"].map(
                      lambda t: SECTOR_KR.get(INFO.get(t, {}).get("sector", ""),
                                              INFO.get(t, {}).get("sector", "") or "미분류"))

                  def one_line(t):
                      ind = (INFO.get(t, {}).get("industry") or "").strip()
                      if ind:
                          kr = INDUSTRY_KR.get(ind) or INDUSTRY_KR.get(ind.split("—")[0].split("-")[0].strip())
                          if kr:
                              return kr
                      return SECTOR_KR.get(INFO.get(t, {}).get("sector", ""), "") or "-"

                  l1["소개"] = l1["코드"].map(one_line)

                  CUR = {"KR": ("원", 1e12, "조", 1e8, "억"), "US": ("달러", 1e12, "조", 1e8, "억"),
                         "JP": ("엔", 1e12, "조", 1e8, "억"), "CN": ("위안", 1e12, "조", 1e8, "억"),
                         "HK": ("HKD", 1e12, "조", 1e8, "억")}

                  def mcap_txt(v, mkt):
                      if not v or v <= 0:
                          return ""
                      unit, t1, n1, t2, n2 = CUR.get(mkt, CUR["US"])
                      if v >= t1:
                          return f"시총 {v/t1:,.1f}{n1}{unit}"
                      if v >= t2:
                          return f"시총 {v/t2:,.0f}{n2}{unit}"
                      return f"시총 {v/1e6:,.0f}백만{unit}"

                  def size_label(v, mkt):
                      if not v or v <= 0:
                          return ""
                      big = {"KR": 1e13, "US": 5e10, "JP": 5e12, "CN": 1e11, "HK": 1e11}.get(mkt, 5e10)
                      return ("초대형주" if v >= big * 4 else "대형주" if v >= big
                              else "중형주" if v >= big / 10 else "소형주")

                  def point(r):
                      t, mkt = r["코드"], r["시장"]
                      inf = INFO.get(t, {})
                      seg = []
                      sz = size_label(inf.get("mcap"), mkt)
                      seg.append(f"{r['소개']} {sz}".strip() if sz else r["소개"])
                      m = mcap_txt(inf.get("mcap"), mkt)
                      if m:
                          seg.append(m)
                      g = EPSG.get(t)
                      if g is not None:
                          seg.append(f"분기이익 +{g*100:.0f}% 급증" if g >= .25 else
                                     f"분기이익 +{g*100:.0f}%" if g > 0 else f"분기이익 {g*100:.0f}%")
                      ro = inf.get("roe")
                      if ro is not None and ro > 0:
                          seg.append(f"ROE {ro*100:.0f}%")
                      if not IS_CUP:
                          seg.append(f"박스 {r['횡보주']:.0f}주 · 폭 {r['횡보폭%']:.0f}%"
                                     + (" · 완전돌파" if r["완전돌파"] else ""))
                      rs_ = r.get("상대강도")
                      if pd.notna(rs_):
                          seg.append(f"주가강도 상위 {100-rs_:.0f}% (최상위권)" if rs_ >= 90 else
                                     f"주가강도 상위 {100-rs_:.0f}%" if rs_ >= 80 else f"주가강도 {rs_:.0f}점")
                      return " · ".join(x for x in seg if x) or "-"

                  l1["투자포인트"] = l1.apply(point, axis=1)
                  cols = list(l1.columns)
                  cols.insert(3, cols.pop(cols.index("섹터")))
                  cols.append(cols.pop(cols.index("소개")))
                  l1 = l1[cols]
