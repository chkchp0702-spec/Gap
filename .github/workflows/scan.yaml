              open("report.html", "w", encoding="utf-8").write("".join(H))

              REPO = os.environ.get("GITHUB_REPOSITORY", "")
              DATE = time.strftime("%Y-%m-%d", time.gmtime(time.time() + 32400))
              PDFN = f"report_{MODE}_{DATE}.pdf"
              if REPO:
