                  md.append("_통과 종목 없음._ 캔슬림 전 항목 통과는 원래 드뭅니다. "
                            "하락장이면 M 규칙 때문에 전부 탈락합니다.\n")
              if cut:
                  md.append("\n> ⚠ 시간 제한으로 일부만 처리했습니다.\n")
