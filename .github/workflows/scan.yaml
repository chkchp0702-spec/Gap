          def fmt(v):
              if isinstance(v, (bool, np.bool_)):
                  return "✓" if v else "·"
              if isinstance(v, float):
                  if pd.isna(v):
                      return "-"
                  return f"{v:,.1f}" if abs(v) < 10000 else f"{v:,.0f}"
              if v is None:
                  return "-"
              return str(v)


          def tbl(d, cols, n=80):
              if d is None or len(d) == 0:
                  return "_해당 없음_\n"
              o = "| " + " | ".join(cols) + " |\n|" + "|".join(["---"] * len(cols)) + "|\n"
              for _, r in d[cols].head(n).iterrows():
                  o += "| " + " | ".join(fmt(r[c]) for c in cols) + " |\n"
              return o


          def by_country(df, cols, open_first=True, n=60):
              if df is None or len(df) == 0:
                  return ["_해당 없음_\n"]
              out, first = [], True
              for code in ["KR", "US", "JP", "CN", "HK"]:
                  g = df[df["시장"] == code] if "시장" in df.columns else df.iloc[0:0]
                  if len(g) == 0:
                      continue
                  op = " open" if (first and open_first) else ""
                  out.append(f"<details{op}>")
                  out.append(f"<summary><b>{NAME[code]} &nbsp; {len(g)}개</b></summary>\n")
                  out.append(tbl(g, cols, n=n))
                  out.append("</details>\n")
                  first = False
              return out or ["_해당 없음_\n"]


          def sector_note(df):
              out = []
              if df is None or len(df) == 0 or "섹터" not in df.columns:
                  return ["_섹터 정보 없음_"]
              for code in ["KR", "US", "JP", "CN", "HK"]:
                  g = df[df["시장"] == code]
                  if len(g) == 0:
                      continue
                  vc = g["섹터"].value_counts()
                  vc = vc[vc.index != "미분류"]
                  if len(vc) == 0:
                      out.append(f"- **{NAME[code]}** ({len(g)}개) — 섹터 미확인")
                      continue
                  tot = int(vc.sum())
                  top = [f"{k} {int(v)}개({v/tot*100:.0f}%)" for k, v in vc.head(3).items()]
                  share = vc.iloc[0] / tot
                  tail = (f" → **{vc.index[0]}** 쏠림" if share >= .5 else
                          f" → {vc.index[0]} 우위" if share >= .3 else " → 특정 섹터 쏠림 없음")
                  out.append(f"- **{NAME[code]}** ({len(g)}개) — " + ", ".join(top) + tail)
              return out


          def h_tbl(df, cols, n=200):
              if df is None or len(df) == 0:
                  return '<p class="none">해당 없음</p>'
              o = ['<table><thead><tr>']
              for c in cols:
                  o.append('<th' + (' class="n"' if c in NUMC else '') + '>' + str(c) + '</th>')
              o.append('</tr></thead><tbody>')
              for k, (_, r) in enumerate(df[cols].head(n).iterrows()):
                  o.append('<tr class="' + ("od" if k % 2 else "") + '">')
                  for c in cols:
                      v = r[c]
                      if c in ("C", "A", "N", "S", "L", "I", "M"):
                          cls = {"pass": "ok", "fail": "no"}.get(str(v), "un")
                          mark = {"pass": c, "fail": "✗"}.get(str(v), "·")
                          o.append('<td class="cs ' + cls + '">' + mark + '</td>')
                          continue
                      cls = []
                      if c in NUMC:
                          cls.append("n")
                      if c == "종목명":
                          cls.append("nm")
                      if c == "투자포인트":
                          cls.append("pt")
                      if c == CFG["score"]:
                          cls.append("sc")
                      if c in SIGN and isinstance(v, float) and not pd.isna(v):
                          cls.append("up" if v >= 0 else "dn")
                      if c == "완전돌파":
                          cls.append("ok" if v else "un")
                      o.append('<td' + ((' class="' + " ".join(cls) + '"') if cls else '') + '>' + fmt(v) + '</td>')
                  o.append('</tr>')
              o.append('</tbody></table>')
              return "".join(o)


          def h_country(df, cols):
              if df is None or len(df) == 0:
                  return '<p class="none">해당 없음</p>'
              out = []
              for code in ["KR", "US", "JP", "CN", "HK"]:
                  g = df[df["시장"] == code] if "시장" in df.columns else df.iloc[0:0]
                  if len(g) == 0:
                      continue
                  out.append('<div class="cty"><span class="cn">' + NAME[code]
                             + '</span><span class="cb">' + str(len(g)) + '개</span></div>')
                  out.append(h_tbl(g, [c for c in cols if c != "시장"]))
              return "".join(out) or '<p class="none">해당 없음</p>'


