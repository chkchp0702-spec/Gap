          LBL = {"uptrend": "상승장", "downtrend": "하락장", "neutral": "횡보장", "": "판정불가"}


          def regime(sym):
              try:
                  b = None
                  for _a in range(3):
                      try:
                          b = yf.Ticker(sym).history(period="2y",
                                                     auto_adjust=False)["Close"]
                          if b is not None and len(b) >= 200:
                              break
                      except Exception:
                          b = None
                      time.sleep(5)
                  if b is None or len(b) < 200:
                      return ""
                  c, a, d = b.iloc[-1], b.rolling(50).mean().iloc[-1], b.rolling(200).mean().iloc[-1]
                  return "uptrend" if c > a > d else ("downtrend" if c < d else "neutral")
              except Exception:
                  return ""


