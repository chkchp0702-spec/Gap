                  g = r["gap_pct"]                     # 갭 크기: 5~15%가 이상적
                  sc += 22 if 5 <= g <= 15 else (16 if 3 <= g <= 25 else 7)
                  v = r["vol_mult"]                    # 거래량: 클수록 좋다
                  sc += 24 if v >= 4 else (19 if v >= 3 else (14 if v >= 2 else 6))
                  rp = r["range_pct"]                  # 횡보가 좁을수록 매물대가 얇다
                  sc += 18 if rp <= 15 else (13 if rp <= 22 else 7)
                  w = r["consol_weeks"]                # 횡보 기간: 길수록 매물 소화
                  sc += 14 if w >= 12 else (10 if w >= 8 else 5)
                  sc += 12 if r["held"] else 0         # 갭을 지키고 있는가
                  a = r["ath_off"]
                  if pd.isna(a):
