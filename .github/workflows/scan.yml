              def one_line(t):
                  """한글 업종명으로 한 줄 소개. 없으면 섹터명."""
                  ind = (IND.get(t) or "").strip()
                  if ind:
                      kr = INDUSTRY_KR.get(ind)
                      if kr:
                          return kr
                      # 사전에 없으면 대시 기준으로 앞부분만 재시도
                      base = ind.split("—")[0].split("-")[0].strip()
                      kr = INDUSTRY_KR.get(base)
                      if kr:
                          return kr
                  sec = SECTOR_KR.get(SEC.get(t, ""), "")
                  return sec or "-"

              l1["소개"] = l1["코드"].map(one_line)

              CUR = {"KR": ("원", 1e12, "조", 1e8, "억"),
                     "US": ("달러", 1e12, "조", 1e8, "억"),
                     "JP": ("엔", 1e12, "조", 1e8, "억"),
                     "CN": ("위안", 1e12, "조", 1e8, "억"),
                     "HK": ("HKD", 1e12, "조", 1e8, "억")}

              def mcap_txt(v, mkt):
                  """시가총액을 조/억 단위 한글로."""
                  if not v or v <= 0:
                      return ""
                  unit, t1, n1, t2, n2 = CUR.get(mkt, CUR["US"])
                  if v >= t1:
                      return f"시총 {v/t1:,.1f}{n1}{unit}"
                  if v >= t2:
                      return f"시총 {v/t2:,.0f}{n2}{unit}"
                  return f"시총 {v/1e6:,.0f}백만{unit}"

              def size_label(v, mkt):
                  if not v or v <= 0:
                      return ""
                  # 통화 차이를 고려해 대략적인 구간
                  big = {"KR": 1e13, "US": 5e10, "JP": 5e12,
                         "CN": 1e11, "HK": 1e11}.get(mkt, 5e10)
                  if v >= big * 4:
                      return "초대형주"
                  if v >= big:
                      return "대형주"
                  if v >= big / 10:
                      return "중형주"
                  return "소형주"

              def point(r):
                  """
                  한 줄 투자포인트. 실제 데이터로만 구성한다.
                  (시장 점유율·업계 순위 같은 확인 안 되는 표현은 쓰지 않는다)
                  """
                  t, mkt = r["코드"], r["시장"]
                  seg = []

                  ind = r["소개"]
                  sz = size_label(MCAP.get(t), mkt)
                  seg.append(f"{ind} {sz}".strip() if sz else ind)

                  m = mcap_txt(MCAP.get(t), mkt)
                  if m:
                      seg.append(m)

                  g = EPSG.get(t)
                  if g is not None and g != 999.0:
                      if g >= 0.25:
                          seg.append(f"분기이익 +{g*100:.0f}% 급증")
                      elif g > 0:
                          seg.append(f"분기이익 +{g*100:.0f}%")
                      else:
                          seg.append(f"분기이익 {g*100:.0f}%")

                  ro = ROE_.get(t)
                  if ro is not None and ro > 0:
                      seg.append(f"ROE {ro*100:.0f}%")

                  rs_ = r.get("상대강도")
                  if pd.notna(rs_):
                      if rs_ >= 90:
                          seg.append(f"주가강도 상위 {100-rs_:.0f}% (최상위권)")
                      elif rs_ >= 80:
                          seg.append(f"주가강도 상위 {100-rs_:.0f}%")
                      else:
                          seg.append(f"주가강도 {rs_:.0f}점")

                  return " · ".join([x for x in seg if x]) or "-"

              l1["투자포인트"] = l1.apply(point, axis=1)
              cols = list(l1.columns)
              cols.insert(3, cols.pop(cols.index("섹터")))
              cols.append(cols.pop(cols.index("소개")))
              l1 = l1[cols]
              l1.to_csv("results/list1_gap.csv", index=False, encoding="utf-8-sig")
              l1[l1["막돌파"] == True].to_csv("results/list0_fresh_gap.csv",  # noqa: E712
                                             index=False, encoding="utf-8-sig")
              n_sec = int((l1["섹터"] != "미분류").sum())
              log(f"섹터 확인 {n_sec}/{len(l1)}종목")


          # --- 보고서 ----------------------------------------------------------------
          def tbl(d, cols, hdr, n=80):
              if d is None or len(d) == 0:
                  return "_해당 없음_\n"
              o = "| " + " | ".join(hdr) + " |\n|" + "|".join(["---"] * len(hdr)) + "|\n"
              for _, r in d[cols].head(n).iterrows():
                  o += "| " + " | ".join(
                      f"{r[c]:,.2f}" if isinstance(r[c], float) else str(r[c])
                      for c in cols) + " |\n"
              return o


