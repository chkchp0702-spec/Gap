           '.none{color:#8d8880;font-style:italic;font-size:8.4pt;padding:4px 2px}'
           ".ft{border-top:2px solid #12355b;margin-top:15px;padding-top:7px;"
           "font-size:7.6pt;color:#8d8880}"
          )

          H = ['<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><style>'
               + CSS + '</style></head><body>'
               + '<div class="top"><h1>갭 돌파 리스트</h1>'
               + '<span class="dt">' + stamp + '</span></div>']

          H.append('<div class="kpi">')
          H.append('<div class="k s"><b>' + str(len(fr)) + '</b><span>★ 방금 갭 돌파</span></div>')
          H.append('<div class="k"><b>' + str(len(top)) + '</b><span>갭 돌파 상위</span></div>')
          H.append('<div class="k c"><b>' + str(len(l2)) + '</b><span>캔슬림 통과</span></div>')
          H.append('<div class="k g"><b>' + str(len(l1)) + '</b><span>갭 발생 전체</span></div>')
          H.append('</div>')

          H.append('<div class="mk">')
          for nm_, code_, *_ in MKT:
              if code_ in REG:
                  st_ = REG[code_]
                  cl = "up" if st_ == "uptrend" else ("dn" if st_ == "downtrend" else "nt")
                  H.append('<div class="m ' + cl + '"><b>' + LBL[st_]
                           + '</b><span>' + nm_ + '</span></div>')
          H.append('</div>')

          H.append('<h2>스캔 결과</h2>')
          H.append('<table><thead><tr><th>나라</th><th class="n">조회</th>'
                   '<th class="n">발견</th><th>비고</th></tr></thead><tbody>')
          for k_, (a_, b_, c_, d_) in enumerate(stats):
              H.append('<tr class="' + ("od" if k_ % 2 else "") + '"><td>' + str(a_)
                       + '</td><td class="n">' + format(b_, ",") + '</td><td class="n">'
                       + str(c_) + '</td><td>' + str(d_) + '</td></tr>')
          H.append('</tbody></table>')

          H.append('<h2>섹터 흐름</h2><div class="sec">')
          for line in sector_note(fr if len(fr) else act):
              H.append('<div>' + line.lstrip("- ").replace("**", "") + '</div>')
          H.append('</div>')

          H.append('<h2 class="star">★ 방금 갭 돌파한 종목 <span class="sm">' + str(len(fr))
                   + '개</span></h2>')
          H.append('<p class="note">횡보 구간을 갭으로 뛰어넘고 3거래일 이내 · '
                   '거래량 동반 · 갭을 지키고 있는 종목</p>')
          H.append(h_country(fr.sort_values("갭후일수") if len(fr) else fr, FC))

          H.append('<h2>갭 돌파 상위 ' + str(len(top)) + '개 <span class="sm">전체 '
                   + str(len(l1)) + '개 중</span></h2>')
          H.append('<p class="note">갭 5일 이내 · 거래량 2.5배↑ · 횡보 폭 22% 이내 · '
                   '횡보 8주↑ · 갭 이후 +10% 이내 · 사상최고가 −10% 이내 · '
                   '상대강도 80↑ · 갭 유지 중 — 모두 통과</p>')
          if len(top) == 0 and globals().get("COND_STAT"):
              H.append('<table><thead><tr><th>조건</th><th class="n">통과</th></tr>'
                       '</thead><tbody>')
              for k_, (cn_, cv_) in enumerate(COND_STAT):
                  H.append('<tr class="' + ("od" if k_ % 2 else "") + '"><td>' + cn_
                           + '</td><td class="n">' + str(cv_) + '개</td></tr>')
              H.append('</tbody></table>')
          H.append(h_country(top, TC))

          H.append('<h2 class="cs">캔슬림 통과 <span class="sm">' + str(len(l2)) + '개</span></h2>')
          if len(l2):
              t2h = l2.rename(columns={"name": "종목명", "ticker": "코드",
                                       "market": "시장", "last": "현재가",
                                       "gap_pct": "갭크기%"})
              H.append('<p class="note">대문자 = 통과, ✗ = 미달, · = 데이터 없음</p>')
              H.append(h_country(t2h, ["종목명", "코드", "시장", "현재가", "갭크기%",
                                       "C", "A", "N", "S", "L", "I", "M"]))
          else:
              H.append('<p class="none">통과 종목 없음 — 캔슬림 전 항목 통과는 드뭅니다. '
                       '하락장이면 M 규칙 때문에 전부 탈락합니다.</p>')

          H.append('<div class="ft">횡보 후 갭 돌파 자동 스캔 결과. '
                   '후보 목록이며 매수 추천이 아닙니다. '
                   '판단과 책임은 투자자 본인에게 있습니다.</div></body></html>')

          open("report.html", "w", encoding="utf-8").write("".join(H))

          # ---------------- 이슈 하단 PDF 링크 ----------------
          REPO = os.environ.get("GITHUB_REPOSITORY", "")
          DATE = time.strftime("%Y-%m-%d", time.gmtime(time.time() + 32400))
          PDFN = f"report_{DATE}.pdf"
          if REPO:
              view = f"https://github.com/{REPO}/blob/main/results/{PDFN}"
              save = f"https://github.com/{REPO}/raw/main/results/{PDFN}"
              md.append("\n---\n")
              md.append(f"### 📄 [PDF로 보기]({view})  ·  [⬇️ PDF 저장]({save})\n")
              md.append("_'PDF로 보기'는 화면에서 바로 열리고, "
                        "'PDF 저장'은 파일로 내려받습니다._\n")
          open("pdfname.txt", "w").write(PDFN)

          body = "\n".join(md)
          if len(body) > 60000:
              body = body[:59000] + "\n\n> 내용이 길어 잘렸습니다. 전체는 results 폴더의 csv 참고.\n"
          open("summary.md", "w", encoding="utf-8").write(body)
          log(f"보고서 완료 ({len(body):,}자)")
          PYTHON_EOF

      - name: 스캔
        timeout-minutes: 115
        env:
          TIME_BUDGET_MIN: "80"
          TOP_FUND: "250"
        run: python scan.py

      - name: PDF 만들기
        if: always()
        run: |
          if [ -f report.html ]; then
            NAME=$(cat pdfname.txt 2>/dev/null || echo report.pdf)
            mkdir -p results
            wkhtmltopdf --enable-local-file-access --print-media-type -q \
              --page-size A4 --orientation Landscape \
              --footer-right "[page] / [topage]" --footer-font-size 7 \
              --footer-font-name "Noto Sans CJK KR" --footer-spacing 4 \
              report.html "results/$NAME" || echo "PDF 변환 실패"
          fi

      - name: 파일 저장
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A results summary.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "결과 $(TZ=Asia/Seoul date '+%m/%d')"
          git push || true

      - name: 결과 올리기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f summary.md ]; then
            gh issue create --title "갭 돌파 $(TZ=Asia/Seoul date '+%m/%d %H:%M')" --body-file summary.md --repo "${{ github.repository }}"
          else
            gh issue create --title "갭 돌파 $(TZ=Asia/Seoul date '+%m/%d') - 실패" --body "스캔이 보고서를 만들지 못했습니다." --repo "${{ github.repository }}"
          fi
