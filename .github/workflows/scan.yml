          def h_tbl(df, cols, n=200):
              if df is None or len(df) == 0:
                  return '<p class="none">해당 없음</p>'
              o = ['<table><thead><tr>']
              for c in cols:
                  cl = ' class="n"' if c in NUMC else ''
                  o.append('<th' + cl + '>' + str(c) + '</th>')
              o.append('</tr></thead><tbody>')
              for k, (_, r) in enumerate(df[cols].head(n).iterrows()):
                  o.append('<tr class="' + ("od" if k % 2 else "") + '">')
                  for c in cols:
                      v = r[c]
                      if c in ("C", "A", "N", "S", "L", "I", "M"):
                          cls = {"pass": "ok", "fail": "no"}.get(str(v), "un")
                          mark = {"pass": c, "fail": "✗"}.get(str(v), "·")
                          o.append('<td class="cs ' + cls + '">' + mark + '</td>')
                          continue
                      cls = []
                      if c in NUMC:
                          cls.append("n")
                      if c == "종목명":
                          cls.append("nm")
                      if c == "투자포인트":
                          cls.append("pt")
                      if c == "갭점수":
                          cls.append("sc")
                      if c in ("매물대대비%", "갭이후%") and isinstance(v, float):
                          cls.append("up" if v >= 0 else "dn")
                      if isinstance(v, float):
                          v = ("{:,.1f}".format(v) if abs(v) < 10000
                               else "{:,.0f}".format(v))
                      cl = (' class="' + " ".join(cls) + '"') if cls else ''
                      o.append('<td' + cl + '>' + str(v) + '</td>')
                  o.append('</tr>')
              o.append('</tbody></table>')
              return "".join(o)


          def h_country(df, cols):
              if df is None or len(df) == 0:
                  return '<p class="none">해당 없음</p>'
              out = []
              for code in ["KR", "US", "JP", "CN", "HK"]:
                  g = df[df["시장"] == code] if "시장" in df.columns else df.iloc[0:0]
                  if len(g) == 0:
                      continue
                  out.append('<div class="cty"><span class="cn">' + NAME[code]
                             + '</span><span class="cb">' + str(len(g)) + '개</span></div>')
                  out.append(h_tbl(g, [c for c in cols if c != "시장"]))
              return "".join(out) or '<p class="none">해당 없음</p>'


