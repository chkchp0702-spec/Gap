                             last=r["last"], gap_pct=r["gap_pct"],
                             vol_mult=r["vol_mult"])
                    gs.append(g)
              except Deadline:
                  cut = True
                  print("  [강제마감] 재무 조회 중단", flush=True)
              finally:
                  clear_deadline()

              if gs:
                  gdf = pd.DataFrame(gs)
                  gdf.to_csv("results/list2_canslim_full.csv", index=False, encoding="utf-8-sig")
